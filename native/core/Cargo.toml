[package]
name = "pena-core"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1"
base64 = "0.22"
futures = "0.3"
indexmap = "2"
percent-encoding = "2"
rand = "0.9"
rquickjs = { version = "0.14", features = ["loader", "rust-alloc"] }
serde_json = { version = "1", features = ["preserve_order", "float_roundtrip"] }
tokio = { version = "1", features = ["process", "time", "rt", "io-util", "macros"] }
url = "2"

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["rt-multi-thread"] }
