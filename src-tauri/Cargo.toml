[package]
name = "pena"
version = "0.1.0"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["devtools", "unstable"] } # unstable: a window with several webviews (tabs)
tauri-plugin-dialog = "2"
serde_json = "1"
base64 = "0.22"
tauri-plugin-updater = "2"

[target.'cfg(target_os = "linux")'.dependencies]
gtk = "0.18" # already in the tree through Tauri: sizing the tab bar

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"
