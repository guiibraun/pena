name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  # o release nasce rascunho: /releases/latest (de onde o app lê o latest.json) só o vê quando todos os sistemas subiram
  create:
    runs-on: ubuntu-latest
    outputs:
      id: ${{ steps.draft.outputs.id }}
    steps:
      - id: draft
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: echo "id=$(gh api repos/${{ github.repository }}/releases -f tag_name=${{ github.ref_name }} -f name='Pena ${{ github.ref_name }}' -f body='Baixe o instalador para o seu sistema abaixo.' -F draft=true --jq .id)" >> "$GITHUB_OUTPUT"

  release:
    needs: create
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-22.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - if: matrix.os == 'ubuntu-22.04'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - uses: oven-sh/setup-bun@v2
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: bun install --frozen-lockfile
      # a tag vX.Y.Z vira a versão do app
      - run: bun -e "const f='src-tauri/tauri.conf.json',c=JSON.parse(require('fs').readFileSync(f,'utf8'));c.version=process.env.GITHUB_REF_NAME.slice(1);require('fs').writeFileSync(f,JSON.stringify(c,null,2))"
        shell: bash
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # assina os pacotes de atualização; o tauri-action sobe o latest.json que o app consulta
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          releaseId: ${{ needs.create.outputs.id }}
          tagName: ${{ github.ref_name }} # os links do latest.json apontam para a tag
          releaseBody: Baixe o instalador para o seu sistema abaixo.
          releaseDraft: true
      # instala o .exe em silêncio e confere se o servidor instalado sobe (se não, o erro aparece aqui no log)
      - if: matrix.os == 'windows-latest'
        shell: bash
        run: |
          src-tauri/target/release/bundle/nsis/*-setup.exe //S
          exe=$(find "$LOCALAPPDATA" -maxdepth 3 -name pena-server.exe | head -1)
          ls -la "$(dirname "$exe")"
          code=0; out=$(PENA_ROOT="$(dirname "$exe")" timeout 60 "$exe" < /dev/null 2>&1) || code=$?
          echo "$out"; echo "saída: $code"
          [[ $out == http* ]]

  # publica só se os três builds passaram; se algum falhar, o rascunho fica para conferir
  publish:
    needs: [create, release]
    runs-on: ubuntu-latest
    steps:
      - env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh api -X PATCH repos/${{ github.repository }}/releases/${{ needs.create.outputs.id }} -F draft=false -f make_latest=true
