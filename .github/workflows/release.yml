name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-22.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - if: matrix.os == 'ubuntu-22.04'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - uses: oven-sh/setup-bun@v2
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: bun install --frozen-lockfile
      # a tag vX.Y.Z vira a versão do app
      - run: bun -e "const f='src-tauri/tauri.conf.json',c=JSON.parse(require('fs').readFileSync(f,'utf8'));c.version=process.env.GITHUB_REF_NAME.slice(1);require('fs').writeFileSync(f,JSON.stringify(c,null,2))"
        shell: bash
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # assina os pacotes de atualização; o tauri-action sobe o latest.json que o app consulta
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: Pena ${{ github.ref_name }}
          releaseBody: Baixe o instalador para o seu sistema abaixo.
          releaseDraft: false
      # instala o .exe em silêncio e confere se o servidor instalado sobe (se não, o erro aparece aqui no log)
      - if: matrix.os == 'windows-latest'
        shell: bash
        run: |
          src-tauri/target/release/bundle/nsis/*-setup.exe //S
          exe=$(find "$LOCALAPPDATA" -maxdepth 3 -name pena-server.exe | head -1)
          ls -la "$(dirname "$exe")"
          code=0; out=$(PENA_ROOT="$(dirname "$exe")" timeout 60 "$exe" < /dev/null 2>&1) || code=$?
          echo "$out"; echo "saída: $code"
          [[ $out == http* ]]
