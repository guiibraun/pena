<!doctype html>
<html lang="en">
<meta charset="utf-8" />
<title>Pena</title>
<link rel="stylesheet" href="/ui.css" />
<style>
  :root { --side-w: 210px; --chat-w: 356px; }
  body { overflow: hidden; }
  /* canvas fills the window; UI floats on top as islands (pen.dev layout) */
  #canvas { position: fixed; inset: 0; overflow: hidden; background: var(--canvas); cursor: default; user-select: none; -webkit-user-select: none; }
  #canvas [contenteditable] { user-select: text; -webkit-user-select: text; }
  #canvas.tool-hand, #canvas.panning { cursor: grab; }
  #canvas.tool-draw { cursor: crosshair; }
  #gl { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
  #world { position: absolute; left: 0; top: 0; transform-origin: 0 0; }
  /* Level of detail: far out, glyphs and icons are sub-pixel; skipping their paint keeps pan/zoom fluid on big files. */
  #world.far [data-k="text"], #world.far [data-k="icon"] { visibility: hidden; }
  #overlay { position: absolute; inset: 0; pointer-events: none; }
  .flabel { position: absolute; transform: translateY(-100%); padding-bottom: 4px; font-size: 12px; color: #9a9aa3; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; pointer-events: auto; cursor: default; }
  .flabel.sel { color: var(--accent); } .flabel.comp { color: #a78bfa; }
  .flabel-edit { position: absolute; z-index: 5; font: inherit; font-size: 12px; line-height: 15px; padding: 0 3px; margin-left: -4px; color: var(--accent); background: #18181b; border: 1px solid var(--accent); border-radius: 3px; outline: none; user-select: text; -webkit-user-select: text; }
  .hover-box { position: absolute; border: 1px solid var(--accent); }
  .sel-box { position: absolute; border: 1.5px solid var(--accent); }
  .sel-box.inst { border-color: #a78bfa; }
  .handle { position: absolute; width: 8px; height: 8px; margin: -4px 0 0 -4px; background: #fff; border: 1.5px solid var(--accent); border-radius: 2px; pointer-events: auto; }
  .size-badge { position: absolute; transform: translate(-50%, 8px); padding: 2px 6px; border-radius: 4px; background: var(--accent); color: #fff; font-size: 11px; white-space: nowrap; }
  .guide { position: absolute; background: #f24822; }
  .guide-label { position: absolute; transform: translate(-50%, -50%); background: #f24822; color: #fff; font-size: 10px; line-height: 14px; padding: 0 4px; border-radius: 3px; white-space: nowrap; }
  .ghost { position: absolute; border: 1px solid var(--accent); background: #3b82f61a; }
  .links { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; pointer-events: none; }
  .links .link { fill: none; stroke: #71717a; stroke-width: 1.5px; }
  .links .link circle { fill: #71717a; stroke: none; }
  .links .link.on { stroke: var(--accent); } .links .link.on circle { fill: var(--accent); }
  .links .link.sel path:not(.hit) { stroke-width: 2.5px; }
  .links .link.drawing path { stroke-dasharray: 6 5; }
  .link-label { position: absolute; left: 0; top: 0; max-width: 220px; padding: 3px 8px; border-radius: 6px; background: #27272a; border: 1px solid #3f3f46; color: #e4e4e7; font-size: 11px; line-height: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; pointer-events: auto; cursor: grab; }
  .link-end { position: absolute; width: 12px; height: 12px; margin: -6px 0 0 -6px; border-radius: 50%; background: #fff; border: 2px solid var(--accent); box-sizing: border-box; pointer-events: auto; cursor: move; }
  .link-label.on { border-color: var(--accent); }
  .link-label.empty { color: #a1a1aa; border-style: dashed; }
  .link-edit { position: absolute; z-index: 5; transform: translate(-50%, -50%); width: 240px; font: inherit; font-size: 11px; line-height: 14px; padding: 4px 8px; color: #fff; background: #27272a; border: 1px solid var(--accent); border-radius: 6px; outline: none; user-select: text; -webkit-user-select: text; }
  .links .hit { stroke: transparent; stroke-width: 12px; pointer-events: stroke; cursor: pointer; }
  .link-handle { position: absolute; width: 12px; height: 12px; margin: -6px 0 0 -6px; border-radius: 50%; background: #fff; border: 2px solid var(--accent); pointer-events: auto; cursor: crosshair; box-sizing: border-box; }
  .link-handle:hover { background: var(--accent); }

  #titlebar { position: fixed; left: 8px; top: 8px; width: 356px; height: 42px; display: flex; align-items: center; gap: 4px; padding: 0 8px 0 14px; z-index: 5; }
  #titlebar .logo { display: flex; align-items: center; gap: 6px; color: var(--fg-strong); font-weight: 600; font-size: 15px; padding-right: 6px; }
  #titlebar .sep { width: 1px; height: 18px; background: var(--line); margin: 0 4px; }
  #docname { flex: 1; min-width: 0; display: flex; align-items: center; gap: 8px; height: 30px; padding: 0 8px; border-radius: 8px; color: var(--fg-strong); cursor: pointer; overflow: hidden; white-space: nowrap; }
  #docname:hover { background: var(--hover); }
  #docname span { overflow: hidden; text-overflow: ellipsis; }

  #conv-sidebar { position: fixed; left: 8px; top: 58px; bottom: 8px; width: var(--side-w); display: flex; flex-direction: column; z-index: 5; overflow: hidden; }
  #left { position: fixed; left: calc(16px + var(--side-w)); top: 58px; bottom: calc(var(--composer-h, 91px) + 16px); width: var(--chat-w); display: flex; flex-direction: column; z-index: 5; overflow: hidden; }
  #side-resize, #chat-resize { position: fixed; z-index: 6; width: 6px; cursor: ew-resize; touch-action: none; }
  #side-resize { top: 58px; bottom: 8px; left: calc(9px + var(--side-w)); }
  #chat-resize { top: 58px; bottom: calc(var(--composer-h, 91px) + 16px); left: calc(17px + var(--side-w) + var(--chat-w)); }
  #side-resize::after, #chat-resize::after { content: ''; position: absolute; top: 50%; left: 50%; width: 2px; height: 28px; margin: -14px 0 0 -1px; border-radius: 2px; background: var(--input); opacity: 0.5; transition: opacity 0.15s; }
  #side-resize:hover::after, #chat-resize:hover::after, #side-resize.drag::after, #chat-resize.drag::after { opacity: 1; background: var(--accent); }
  .tabs { display: flex; align-items: center; gap: 2px; padding: 8px 8px 6px; }
  .tabs .btn { height: 34px; }
  .tabs .btn:not(.on) .txt { display: none; }
  .pane { flex: 1; min-height: 0; overflow: auto; display: none; }
  .pane.on { display: flex; flex-direction: column; }

  /* Conversations sidebar: groups with their chats, pinned chats on top, like T3 Code/ChatGPT. */
  #pane-chat { overflow: hidden; }
  #chat-view { flex: 1; min-height: 0; display: flex; flex-direction: column; }
  #list-head { display: flex; align-items: center; gap: 4px; height: 38px; padding: 0 6px 0 12px; }
  #list-head b { flex: 1; color: var(--fg-strong); font-size: 13px; font-weight: 500; }
  #list-search { margin: 0 8px 8px; height: 30px; }
  #list-search input { font-size: 12px; }
  #convs { flex: 1; min-height: 0; overflow: auto; padding: 0 6px 8px; }
  #new-group { margin: 0 8px 8px; height: 30px; justify-content: flex-start; padding: 0 8px; color: var(--muted); font-size: 12px; }
  .conv-section + .conv-section { margin-top: 6px; }
  .section-head { display: flex; align-items: center; gap: 6px; height: 28px; padding: 0 4px 0 6px; border-radius: 6px; color: var(--muted); font-size: 12px; font-weight: 500; user-select: none; }
  .section-head:not(.static) { cursor: pointer; }
  .section-head:not(.static):hover { background: #ffffff08; color: var(--fg-strong); }
  .section-head .arrow { width: 12px; height: 12px; display: grid; place-items: center; flex: none; transition: transform 0.12s; }
  .section-head.static .arrow { visibility: hidden; }
  .conv-section.collapsed .arrow { transform: rotate(-90deg); }
  .section-head .name { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .section-head .count { color: var(--subtle); font-size: 11px; font-weight: 400; }
  .head-act { display: grid; place-items: center; visibility: hidden; width: 20px; height: 20px; padding: 0; border: 0; border-radius: 5px; background: none; color: var(--subtle); cursor: pointer; flex: none; }
  .head-act:hover { background: var(--hover); color: var(--fg-strong); }
  .section-head:hover .head-act { visibility: visible; }
  /* A collapsed group keeps the open conversation in sight, so you still know (and can reach) where you are. */
  .conv-section.collapsed .section-body > :not(.on) { display: none; }
  .conv-row { display: flex; align-items: center; gap: 0; height: 30px; padding: 0 4px 0 8px; border-radius: 7px; color: var(--fg); cursor: pointer; }
  .conv-row:hover { background: #ffffff0a; }
  .conv-row.on { background: var(--input-soft); color: var(--fg-strong); }
  .conv-row.has-sub { height: 40px; padding-top: 4px; padding-bottom: 4px; }
  .conv-row .dot-slot { width: 12px; display: grid; place-items: center; flex: none; }
  .conv-row .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--accent); animation: pulse 1.4s ease-in-out infinite; }
  @keyframes pulse { 50% { opacity: 0.35; } }
  .conv-row .col { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 1px; }
  .conv-row .t { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 12.5px; }
  .conv-row .sub { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--subtle); font-size: 10.5px; }
  .row-act { display: grid; place-items: center; visibility: hidden; width: 20px; height: 20px; padding: 0; border: 0; border-radius: 5px; background: none; color: var(--subtle); cursor: pointer; flex: none; }
  .row-act:hover { background: var(--hover); color: var(--fg-strong); }
  .conv-row:hover .row-act { visibility: visible; }
  .conv-empty { padding: 18px 10px; color: var(--subtle); font-size: 12px; }
  .conv-new { margin-top: 10px; height: 30px; font-size: 12px; }

  #chat-head { display: flex; flex-direction: column; gap: 2px; padding: 4px 6px 6px; border-bottom: 1px solid var(--line); }
  #chat-head .chat-row { display: flex; align-items: center; gap: 2px; height: 30px; }
  #chat-head .btn.icon { width: 28px; height: 28px; }
  #conv-name { flex: 1; min-width: 0; border: 0; outline: none; background: none; color: var(--fg-strong); font-size: 13px; font-weight: 500; text-overflow: ellipsis; cursor: default; }
  #pin-chat.pinned { color: var(--accent); }
  #chat-head .group-btn { border: 0; padding: 0 6px; align-self: flex-start; background: none; display: inline-flex; align-items: center; gap: 5px; max-width: 90%; height: 22px; border-radius: 6px; color: var(--muted); cursor: pointer; font-size: 12px; }
  #chat-head .group-btn:hover { background: var(--hover); color: var(--fg-strong); }
  #chat-head .group-btn.none { color: var(--subtle); }
  #chat-head .group-btn span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .group-form { display: grid; gap: 12px; padding: 16px; overflow: auto; }
  .group-form label { display: grid; gap: 6px; color: var(--muted); font-size: 12px; }
  .group-form input, .group-form textarea { width: 100%; border: 0; border-radius: 8px; padding: 9px 10px; background: var(--input-soft); color: var(--fg-strong); outline: none; resize: vertical; }
  .group-form input:focus, .group-form textarea:focus { box-shadow: inset 0 0 0 1px var(--accent); }
  .group-form .hint { color: var(--subtle); font-size: 12px; line-height: 1.5; }
  /* The empty chat explains the group that new chats inherit here, instead of leaving the instructions hidden in a menu. */
  .empty-chat .group-card { margin: 14px 0 4px; padding: 10px 12px; border-radius: 10px; background: #ffffff06; box-shadow: inset 0 0 0 1px var(--line); }
  .group-card .gc-head { display: flex; align-items: center; gap: 6px; color: var(--fg-strong); font-size: 12px; }
  .group-card .gc-head b { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-weight: 500; }
  .group-card .gc-edit { border: 0; background: none; padding: 2px 5px; border-radius: 5px; color: var(--muted); cursor: pointer; display: inline-flex; align-items: center; gap: 4px; font-size: 11px; }
  .group-card .gc-edit:hover { color: var(--fg-strong); background: var(--hover); }
  .group-card p { margin: 6px 0 0; color: var(--muted); font-size: 12px; line-height: 1.45; white-space: pre-wrap; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
  .group-card.empty { display: flex; align-items: center; gap: 8px; width: 100%; padding: 10px 12px; text-align: left; color: var(--muted); font-size: 12px; cursor: pointer; background: none; border: 1px dashed var(--line); border-radius: 10px; }
  .group-card.empty:hover { background: var(--hover); border-color: transparent; color: var(--fg-strong); }
  #log { flex: 1; overflow: auto; padding: 12px 12px 16px; display: flex; flex-direction: column; gap: 10px; }
  .msg { white-space: pre-wrap; line-height: 1.5; color: var(--fg-strong); font-size: 13px; overflow-wrap: anywhere; }
  .msg.text, .msg.user { position: relative; }
  .copy-msg { position: absolute; top: 2px; right: 2px; display: none; padding: 4px; border: 0; border-radius: 6px; background: var(--island); color: var(--muted); cursor: pointer; }
  .copy-msg:hover { color: var(--fg-strong); background: var(--hover); }
  .msg:hover > .copy-msg { display: flex; }
  .msg.streaming > .copy-msg { display: none; }
  .msg.user { align-self: flex-end; max-width: 88%; padding: 8px 12px; border-radius: 14px; background: var(--input-soft); }
  .msg.tool { display: flex; align-items: center; gap: 8px; color: var(--muted); font-size: 12px; white-space: normal; }
  .msg.tool .ic { width: 13px; height: 13px; }
  .msg.error { color: var(--danger); }
  .msg.who { color: #a78bfa; font-size: 11px; margin-bottom: -6px; }
  .msg code { background: #ffffff12; padding: 1px 5px; border-radius: 4px; font: 12px ui-monospace, monospace; }
  .msg img { max-width: 100%; border-radius: 10px; }
  .empty-chat { margin: auto 0; padding: 8px 6px; }
  .empty-chat h4 { margin: 0 0 12px; font-weight: 400; color: var(--fg-strong); font-size: 14px; }
  .suggest { display: block; width: fit-content; max-width: 100%; margin: 0 0 8px; padding: 9px 14px; border: 0; border-radius: 10px; background: none; box-shadow: inset 0 0 0 1px var(--line); color: var(--fg-strong); text-align: left; cursor: pointer; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .suggest:hover { background: var(--hover); }
  .tip { margin-top: 22px; color: var(--muted); line-height: 1.5; } .tip b { display: block; color: var(--fg-strong); font-weight: 500; margin-bottom: 4px; }

  #layers, #components { padding: 4px 6px 12px; }
  #layer-search { margin: 8px 8px 0; height: 30px; flex: none; }
  #layer-search input { font-size: 12px; }
  .row { display: flex; align-items: center; gap: 6px; height: 30px; padding-right: 8px; border-radius: 8px; color: var(--fg); cursor: default; white-space: nowrap; user-select: none; }
  .row:hover { background: #ffffff0a; }
  .row.sel { background: #3b82f633; color: var(--fg-strong); }
  .row.inst { color: #c4b5fd; } .row.comp { color: #a78bfa; }
  .row .tw { width: 16px; height: 16px; display: grid; place-items: center; color: var(--subtle); flex: none; cursor: pointer; }
  .row .tw .ic { width: 12px; height: 12px; transition: transform 0.1s; } .row .tw.open .ic { transform: rotate(90deg); }
  .row .nm { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; }
  .row .eye { opacity: 0; color: var(--subtle); cursor: pointer; } .row:hover .eye, .row.hidden .eye { opacity: 1; }
  .row.hidden .nm { opacity: 0.45; }
  .row input { all: unset; flex: 1; background: var(--input); border-radius: 4px; padding: 0 4px; color: var(--fg-strong); }

  #composer { position: fixed; left: calc(16px + var(--side-w)); bottom: 8px; width: var(--chat-w); min-height: 91px; display: flex; flex-direction: column; z-index: 5; }
  #attachments { display: flex; flex-wrap: wrap; gap: 6px; padding: 10px 12px 0; }
  #attachments:empty { display: none; }
  #handoff-pending { padding: 10px 12px 0; } #handoff-pending:empty { display: none; }
  #mcp-banner { display: flex; align-items: center; gap: 8px; margin: 10px 12px 0; padding: 7px 8px 7px 10px; border-radius: 8px; background: #ef444414; box-shadow: inset 0 0 0 1px #ef444466; color: #fca5a5; font-size: 12px; }
  #mcp-banner:empty { display: none; }
  #mcp-banner span { flex: 1; }
  #mcp-banner .btn { height: 24px; padding: 0 8px; font-size: 12px; }
  #mcp-banner.ok { background: #22c55e14; box-shadow: inset 0 0 0 1px #22c55e55; color: #86efac; }
  #composer.offline { outline: 1px solid #ef4444aa; outline-offset: 1px; }
  #handoff-pending .q { display: flex; align-items: center; gap: 6px; min-height: 26px; padding: 3px 8px; border-radius: 6px; background: #ffffff08; color: var(--muted); font-size: 12px; }
  #handoff-pending .q { flex-wrap: wrap; } #handoff-pending .handoff-route { justify-content: flex-start; }
  #queue { display: flex; flex-direction: column; gap: 4px; padding: 10px 12px 0; }
  #queue:empty { display: none; }
  #queue .q { display: flex; align-items: center; gap: 6px; height: 26px; padding: 0 4px 0 8px; border-radius: 6px; box-shadow: inset 0 0 0 1px var(--line); color: var(--muted); font-size: 12px; }
  #queue .q span { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #queue .q button { all: unset; cursor: pointer; display: grid; padding: 3px; border-radius: 4px; } #queue .q button:hover { color: var(--fg-strong); }
  .msg.files { align-self: flex-end; display: flex; flex-wrap: wrap; gap: 6px; justify-content: flex-end; background: none; padding: 0; }
  .att { display: inline-flex; align-items: center; gap: 6px; height: 24px; padding: 0 8px; border-radius: 6px; box-shadow: inset 0 0 0 1px var(--line); color: var(--muted); font-size: 12px; }
  .att button { all: unset; cursor: pointer; display: grid; }
  #prompt { flex: 1 0 auto; min-height: 38px; max-height: 50vh; padding: 12px 14px 0; border: 0; background: none; resize: none; outline: none; color: var(--fg-strong); }
  #prompt::placeholder { color: #8a8a93; }
  #composer .grip { position: absolute; left: 0; right: 0; top: -4px; height: 8px; cursor: ns-resize; z-index: 1; }
  #composer .grip::after { content: ''; position: absolute; left: 50%; top: 5px; width: 32px; height: 3px; margin-left: -16px; border-radius: 2px; background: var(--line); opacity: 0; transition: opacity 0.15s; }
  #composer:hover .grip::after, #composer .grip.drag::after { opacity: 1; }
  #left.drop-hint, #composer.drop-hint { box-shadow: inset 0 0 0 2px #a78bfa; }
  #composer .bar { display: flex; align-items: center; gap: 2px; padding: 4px 8px 8px; }
  #composer .bar .grow { flex: 1; }
  #composer .bar .btn { height: 28px; font-size: 12px; color: var(--muted); padding: 0 8px; }
  #effort { color: #facc15 !important; }
  .send { width: 28px; height: 28px; border-radius: 50%; border: 0; background: var(--primary); color: var(--primary-fg); display: grid; place-items: center; cursor: pointer; flex: none; margin-left: 4px; }

  #tools { position: fixed; left: calc(24px + var(--side-w) + var(--chat-w)); top: 58px; width: 40px; display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 4px 0; border-radius: 14px; z-index: 5; }
  #tools .btn { width: 32px; height: 32px; padding: 0; }
  #tools .btn.on { background: var(--accent); color: #fff; }
  #tools .split { height: 1px; width: 22px; background: var(--line); margin: 3px 0; }
  #panels-toggle { position: fixed; left: calc(24px + var(--side-w) + var(--chat-w)); top: 8px; width: 40px; height: 42px; z-index: 5; border-radius: 14px; }

  #topbar { position: fixed; top: 8px; right: 288px; height: 42px; display: flex; align-items: center; gap: 2px; padding: 0 6px; border-radius: 21px; z-index: 5; }
  #topbar .btn { height: 32px; border-radius: 16px; }
  #topbar .sep { width: 1px; height: 18px; background: var(--line); margin: 0 4px; }

  #props { position: fixed; right: 8px; top: 8px; bottom: 8px; width: 272px; overflow: auto; z-index: 5; padding-bottom: 12px; }
  #zoom { position: fixed; right: 288px; bottom: 8px; height: 42px; display: flex; align-items: center; gap: 2px; padding: 0 5px; border-radius: 21px; z-index: 5; }
  #zoom .pct { min-width: 64px; }
  body.hide-ui #titlebar, body.hide-ui #conv-sidebar, body.hide-ui #left, body.hide-ui #composer, body.hide-ui #side-resize, body.hide-ui #chat-resize, body.hide-ui #tools, body.hide-ui #props, body.hide-ui #topbar, body.hide-ui #zoom, body.hide-ui #panels-toggle { display: none; }
  body.no-props #props { display: none; } body.no-props #topbar, body.no-props #zoom { right: 8px; }
  /* Only the chat (its panel and composer) goes away: the conversations sidebar stays, and the canvas gets its width. */
  body.no-chat #left, body.no-chat #composer, body.no-chat #chat-resize { display: none; }
  body.no-chat #tools, body.no-chat #panels-toggle { left: calc(24px + var(--side-w)); }
  /* Only the conversations list folds away: the chat stays open and everything shifts left to take its place. */
  body.no-convs { --side-w: -8px; } body.no-convs #conv-sidebar, body.no-convs #side-resize { display: none; }
  #list-show { display: none; } body.no-convs #list-show { display: inline-flex; }
  body.no-left #conv-sidebar, body.no-left #left, body.no-left #composer, body.no-left #titlebar, body.no-left #side-resize, body.no-left #chat-resize { display: none; } body.no-left #tools { left: 8px; top: 58px; } body.no-left #panels-toggle { left: 8px; }

  /* properties panel */
  .p-head { display: flex; align-items: center; gap: 8px; height: 50px; padding: 0 10px 0 16px; border-bottom: 1px solid var(--line); color: var(--fg-strong); }
  .p-head input { all: unset; flex: 1; min-width: 0; padding: 4px 6px; margin-left: -6px; border-radius: 6px; }
  .p-head input:hover { box-shadow: inset 0 0 0 1px var(--line); } .p-head input:focus { box-shadow: inset 0 0 0 1px var(--accent); }
  .sec { padding: 14px 16px; border-bottom: 1px solid var(--line); }
  .sec:last-child { border-bottom: 0; }
  .sec > .t { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; color: var(--fg-strong); font-weight: 500; }
  .sec > .t .btn { height: 24px; width: 24px; padding: 0; color: var(--muted); }
