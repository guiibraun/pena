# No published ports: the only way in is the Cloudflare Tunnel, behind Cloudflare Access (your Google/GitHub login).
# .env: PENA_TOKEN (for /mcp) and TUNNEL_TOKEN (`cloudflared tunnel token <name>`, or Zero Trust > Networks > Tunnels).
services:
  pena:
    build: .
    restart: unless-stopped
    init: true # reaps the CLIs and the on-demand Chromium that agents leave behind
    environment:
      PENA_TOKEN: ${PENA_TOKEN:?set PENA_TOKEN}
    volumes:
      - home:/root
      - designs:/data
  tunnel:
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    # --url: a tunnel made with the CLI (`cloudflared tunnel create`) has no ingress in the dashboard
    command: tunnel --no-autoupdate run --url http://pena:4500
    environment:
      TUNNEL_TOKEN: ${TUNNEL_TOKEN:?set TUNNEL_TOKEN}
    depends_on: [pena]
volumes:
  home:
  designs:
